<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Brain Co. LP reporting demo (sample data)</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/demo.css">
</head>
<body data-step="0">
<div class="app">
  <header class="topbar" id="topbar"></header>
  <section class="story" aria-live="polite">
    <div class="story-text">
      <div class="story-step" id="story-step"></div>
      <h1 id="story-title"></h1>
      <p id="story-sub"></p>
    </div>
    <div id="legend"></div>
  </section>
  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
    <aside class="drawer" id="drawer" aria-label="Sources" hidden></aside>
  </div>
  <nav class="demo-nav" id="demo-nav" aria-label="Guided tour"></nav>
</div>
<noscript><p class="noscript">This demo needs JavaScript. All data shown is fictional sample data.</p></noscript>
<script src="data/demo-data.js"></script>
<script src="js/demo.js"></script>
</body>
</html>
